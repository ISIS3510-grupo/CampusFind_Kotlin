name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so SonarQube Cloud can compute new code and blame

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests with coverage
        run: ./gradlew createDebugUnitTestCoverageReport

      - name: Coverage summary
        if: always()
        run: |
          report=app/build/reports/coverage/test/debug/report.xml
          if [ -f "$report" ]; then
            python3 - "$report" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          line = next((c for c in root.findall("counter") if c.get("type") == "LINE"), None)
          if line is not None:
              covered, missed = int(line.get("covered")), int(line.get("missed"))
              total = covered + missed
              pct = 100 * covered / total if total else 0
              print(f"### Line coverage: {pct:.1f}% ({covered}/{total} lines) - informative, not required")
          PY
          fi

      - name: Lint
        run: ./gradlew lintDebug
        continue-on-error: true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/coverage/test/debug/
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/
          if-no-files-found: ignore

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

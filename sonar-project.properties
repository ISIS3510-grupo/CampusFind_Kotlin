sonar.projectKey=ISIS3510-grupo_CampusFind_Kotlin
sonar.organization=isis3510-grupo
sonar.projectName=CampusFind Kotlin

sonar.sources=app/src/main/java
sonar.tests=app/src/test/java
# Coverage is measured in CI (job summary + artifact) but is optional for now:
# the free SonarQube Cloud plan only allows the "Sonar way" gate, which requires
# 80% coverage on new code. Remove the next line to make coverage count again.
sonar.coverage.exclusions=**/*
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/coverage/test/debug/report.xml
sonar.androidLint.reportPaths=app/build/reports/lint-results-debug.xml
sonar.sourceEncoding=UTF-8
